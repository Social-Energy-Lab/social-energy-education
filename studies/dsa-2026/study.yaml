# Non-personal configuration for the DSA 2026 field phase.
# Instrument-level facts only. Person-level data (who wore what, exclusions) lives
# in the local spine under $SOCIAL_ENERGY_DATA/dsa-2026/spine/.
# Times are local wall-clock (Europe/Berlin) unless stated otherwise.

study_id: dsa-2026
timezone: Europe/Berlin
site: Schwäbisch Gmünd
dates:
  arrival: 2026-08-13
  departure: 2026-08-29

beacons:
  upstream_repo: https://github.com/thofbaur/network-beacon_NRF54L15
  firmware_commit: null   # [unknown: commit flashed at arrival]
  valid_from: 2026-08-12  # plausibility window for record timestamps
  valid_to: 2026-08-29
  # What the analyses count. Start: the beacon team's deployment start (processing guide); tags
  # were on participants from 11:30, and arrival afternoon holds setup and test activity.
  # `[unknown: confirm with the beacon team that 13 Aug 11:30-18:00 is not usable]`
  # End: tags handed back (stricter than the guide's 11:00).
  observation_window: {start: "2026-08-13 18:00:00", end: "2026-08-29 09:00:00"}
  # Logger printed beacon IDs 48-57 as "0"-"9" on lines stamped up to 22:00 that day (firmware
  # team's processing guide, 2026-10-17); the upstream fix commit 2e1f52d is from 20:17.
  ambiguous_id_cutoff: "2026-08-15 22:00:00"
  # The fielded ID table: tags 1-170, development kits 252-254 (255 = address not in the table).
  valid_id_ranges: [[1, 170], [252, 254]]
  rssi_range: [-110, -10]
  # 238 full flash blocks of 804 plus the RAM ring: a Contact Count this high means flash was full.
  storage_full_count: 215000
  # Tags count fast against the logger clock: 234.9 ppm (20.3 s/day), the median minimum-delay
  # slope over the cleanly fitted power cycles (estimate_clock_rate, 2026-10-17). One rate for all
  # tags: the clean cycles agree closely. [unknown: crystal or RC oscillator on the tag board?]
  clock_rate_ppm: 234.9
  # We ingest the raw logs (the delivery's Original/) and repair the IDs ourselves: clock anchors
  # first, then partners' ID2 witnesses. The beacon team's hand split of 13-15 Aug
  # (*_cleaned.log) is kept as a benchmark, not trusted as input.
  ids_split_in: []
  rssi_threshold_dbm:
    person_tag: -80
    location_tag: -100
  scan: { window_ms: 120, interval_ms: 7000 }
  eco_scan: { window_ms: 100, period_s: 300, inactivity_timeout_s: 1800 }
  settings_changes:
    - at: "2026-08-14 21:00"
      what: all tags reflashed with eco mode enabled (was missing before)
    - at: "2026-08-15 17:45"
      what: main-hall and hall-dining corridor location tags (134-142) reflashed with eco mode off and accelerometer off
  logger_incidents:
    - at: "2026-08-14 10:20"
      what: logger did not write to file for a few minutes; data remained on tags
    - at: "2026-08-15 14:30"
      what: corrupted logger output noticed; logger script updated before the midnight readout
  self_report:
    instruction_given: "2026-08-14 08:45"
    clarified_not_necessarily_positive: ["2026-08-14 08:45", "2026-08-15 09:00"]
    gesture: one long press of ~3 s, until the tag glows red
    # What participants were told: a second long press directly afterwards takes an accidental
    # report back. The firmware cannot tell it from a re-press, so the analyses do not apply it;
    # only long repeated runs are removed (decided 2026-10-01).
    retraction: second long press directly afterwards

eda:
  device_ids: [SH01, SH02, SH03, SH04, SH05, SH06, SH07, SH08, SH09, SH10, SH11, SH12, SH13, SH14, SH15]
  session_days: [2026-08-15, 2026-08-16, 2026-08-17, 2026-08-19, 2026-08-20, 2026-08-21,
                 2026-08-22, 2026-08-23, 2026-08-24, 2026-08-25, 2026-08-26, 2026-08-27, 2026-08-28]
  note: no sensors on the excursion day (2026-08-18)

acoustics:
  devices:
    - id: audiomoth:mensa
      location: dining hall
      zone: mensa   # the room-tag zone it sits in (locations.yaml)
      schedule_from_2026-08-14:   # before: 07:30-09:00, 11:30-14:00, 18:30-20:30
        - "07:25-08:35"
        - "10:10-11:00"   # as recorded from 15 Aug (file start times); noted as 10:25-11:05
        - "12:00-13:45"
        - "15:55-19:10"
    - id: audiomoth:plenum
      location: main hall
      zone: aula
      schedule_from_2026-08-14:   # before: 08:00-09:30, 18:30-21:30
        - "08:20-09:20"
        - "14:00-16:30"
        - "19:10-22:30"
  incidents:
    - at: "2026-08-14 10:00"
      what: possibly wrong settings between 10:00 and 10:30 while schedules were changed
    - note: afternoon plenums on 2026-08-16 and 2026-08-23 (13:30-14:00) were not recorded
  wav_retention: delete after feature extraction (ethics requirement)

# The survey and AI interviews were delivered by a private platform deployment. Which agent to
# fetch, and which question carries the typed study ID, name that deployment, so they live with
# the data in $SOCIAL_ENERGY_DATA/dsa-2026/local.yaml and never in this repo. The wave itself is
# not a secret: a voice interview followed by the baseline survey, 4-15 Aug 2026, before arrival.
#
# Download: ZEITGEIST_DATABASE_URL=... uv run --extra zeitgeist \
#     social-energy fetch-zeitgeist studies/dsa-2026/study.yaml

# Survey scoring (social-energy score-survey): codes, scales and recoding rules, no item wording.
survey:
  codebook: survey_codebook.yaml
  # Scales are scored only after research/analysis-plan.md is signed and frozen. score-survey
  # refuses until this holds the freeze date and commit.
  analysis_plan_frozen: null  # [unknown: when is the analysis plan signed off? set "<date> <commit>"]

# How the explorer (social_energy.explorer) presents this study.
explorer:
  # Display names. The official titles are not in the repo yet:
  # [unknown: what are the official course titles for DSA 2026?]
  courses: {"1.1": course 1.1, "1.2": course 1.2, "1.3": course 1.3,
            "1.4": course 1.4, "1.5": course 1.5, "1.6": course 1.6}
  day_start: "07:30"  # a camp day runs 07:30-07:30, so the night belongs to the evening before
  phases:  # clock blocks of the academy's usual weekday rhythm [inferred]
    - [morning, "07:30"]
    - [midday, "12:30"]
    - [afternoon, "14:00"]
    - [dinner, "18:30"]
    - [evening, "19:30"]
    - [late, "22:30"]
    - [night, "02:00"]
  notes:
    - {start: "2026-08-13 07:30", end: "2026-08-14 07:30", text: arrival day}
    - {start: "2026-08-18 07:30", end: "2026-08-19 07:30", text: excursion day}
    - {start: "2026-08-22 07:30", end: "2026-08-23 07:30", text: "rotation day: courses present to each other"}
  shade:
    - {start: "2026-08-24 07:30", end: "2026-08-28 07:30", label: "tag batteries failing: fewer scans, not fewer encounters"}
  defaults: {close_rssi: -65, min_minutes: 15, window_minutes: 120}
