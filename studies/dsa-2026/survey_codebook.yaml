# Survey codebook, DSA 2026 baseline (SurveyJS short version on zeitgeist-platform).
#
# Codes and scales only. No item wording: the study's own items (ZGL_*, RSWE_*, *_GRAD,
# SYMBOL_*) are unpublished, and PISA items are referenced by code. The spec behind every
# entry is docs/context/instruments/survey.md; the loader is social_energy.survey.codebook.
#
# Codes are the export's item codes: matrix rows are "<BLOCK_SCALE>.<ITEM>" (written here as
# `prefix` + item), standalone items use their bare code.
#
# Recoding per group: non-substantive codes and out-of-range values -> missing; a scale printed
# in reverse (printed_reversed) is flipped so that high = more of the construct; then each item
# in `reverse` (worded against the construct, judged AFTER that flip) is flipped. Both flips
# are min + max - x.
#
# Status: `confirmed` (research team), `inferred` (from documents, not confirmed), `unknown`.
# Everything below that the research team has not confirmed says so, and every scoring run
# lists it (Codebook.pending, qa.json "pending"). The questions to answer are under `pending`.

title: DSA 2026 baseline survey
version: 1
roles: {A: background, B: trust_in_life, C: lust_for_life}

# A scale score needs valid answers on at least ceil(min_share x items) of its items, unless a
# group sets min_items. [inferred] Proposed default; PISA scales its indices only for students
# with at least three valid answers.
min_share: 0.5
min_share_status: inferred

pending:
  - "[unknown: confirm the reverse-keying list: every scale's `reverse` below, including the scales with none]"
  - "[unknown: which B19/B20 slider range went live, 1-10 or 0-10?] The export holds 1-10 only, which fits either."
  - "[unknown: do the old form-version codes in `renames` stand for the same items, on the same response format, as their current codes?]"
  - "[unknown: is a scale score valid from half its items (min_share 0.5), or should a stricter rule apply?]"
  - "[unknown: B16 and C5 are split into positive and negative affect subscales; should the PISA single index (negative items reversed) be scored as well?]"
  - "[unknown: do the B16 add-ons (tired, listless, exhausted) form their own subscale, or join negative affect?]"
  - "[unknown: are B19 (fear drivers) and B20 (sources of joy) meant as scales, or read item by item?]"

# Old form-version code -> current code. Both are never present on one record in the export;
# a record carrying both would keep the current code and count a conflict in the QA.
renames:
  GRADIENT_variable_C11:
    to: ZGL_C11_GRAD
    status: inferred
    note: "[inferred] form version 16 only, in the flat view; renamed in later versions"
  GRADIENT_variable_C21:
    to: ZGL_C21_GRAD
    status: inferred
    note: "[inferred] form version 16 only, in the flat view; renamed in later versions"
  C1A_SWE.SWE_05_resonance:
    to: C1A_SWE.SWE_05
    status: inferred
    note: "[inferred] same matrix row under an earlier key: form version 16 carries it in place of SWE_05"
  C1A_SWE.SWE_06_resonance:
    to: C1A_SWE.SWE_06
    status: inferred
    note: "[inferred] as SWE_05_resonance"
  C1A_SWE.SWE_07_resonance:
    to: C1A_SWE.SWE_07
    status: inferred
    note: "[inferred] as SWE_05_resonance"

