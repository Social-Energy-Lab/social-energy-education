# Known codes that are not scored here. Patterns use shell wildcards. Free text never leaves
# the private data root.
unscored:
  background: [ST001, ST003C01TA_DE, ST003C02TA_DE, ST004, ST005, ST007, ST021C01TA_DE, ST226,
               ST230, ST255, ZGL_A1_2, ZGL_A4_SCHULART, "A9_ST006.*", "A12_ST008.*",
               "A15_ST250.*", "A16_ST251.*"]
  free_text: [ZGL_A1_1, ST019AC01_DE, ST019BC01_DE, ST019CC01_DE, ST022, ZGL_A22_2, ST329,
              SYMBOL_1]
  # B7 "other" activities: up to five free-text rows, each with its own frequency item.
  dynamic: ["ZGL_B7_05*"]
  # B21's not-applicable option.
  flags: [SYMBOL_3]
